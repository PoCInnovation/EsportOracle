services:
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esportoracle-backend
    env_file:
      - .env
    environment:
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL_CONTAINER:-http://host.docker.internal:8545}
    ports:
      - "8080:8080"
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://backend:8080}
    container_name: esportoracle-front
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: esportoracle-net
